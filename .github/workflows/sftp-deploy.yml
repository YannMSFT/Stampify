name: Deploy via SFTP

# Déploiement du site statique vers un serveur distant via rsync over SSH (SFTP).
# Authentification par clé SSH uniquement (aucun mot de passe en clair).
# Ce workflow est indépendant des workflows Azure Static Web Apps existants.

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions minimales : on a seulement besoin de lire le code source.
permissions:
  contents: read

# Empêche deux déploiements simultanés ; annule le précédent encore en cours.
concurrency:
  group: sftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # L'Environment "production" permet de rattacher les secrets à un environnement
    # protégeable (required reviewers, restriction de branche, approbation manuelle).
    environment: production

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Déploiement SFTP (rsync over SSH)
        # easingthemes/ssh-deploy v6.0.1 — pinné sur le SHA de commit pour la
        # sécurité de la chaîne d'approvisionnement (supply-chain), pas sur le tag.
        uses: easingthemes/ssh-deploy@5d8aeab1a56041e269567e67a08ce00df324a617 # v6.0.1
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SFTP_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SFTP_HOST }}
          REMOTE_USER: ${{ secrets.SFTP_USERNAME }}
          REMOTE_PORT: ${{ secrets.SFTP_PORT }}
          TARGET: ${{ secrets.SFTP_TARGET_DIR }}
          SOURCE: "./"
          # Options rsync :
          #   -r récursif, -l liens symboliques, -t timestamps, -z compression,
          #   -v verbeux, -i itemize, --delete supprime côté serveur les fichiers
          #   absents de la source (déploiement propre du site).
          ARGS: "-rltzvi --delete"
          # Fichiers/dossiers non servis par le site, exclus du transfert.
          EXCLUDE: ".git, .gitignore, .github, specs, .specify, README.md, LICENSE, THIRD_PARTY_NOTICES.md, .ssh-deploy-state"
          # Vérification de la clé hôte (host key) activée pour rsync.
          # Voir README-sftp-deploy.md : la clé hôte est récupérée par ssh-keyscan
          # (déclenché par SCRIPT_BEFORE) puis validée ici. Limite connue :
          # l'action réinitialise known_hosts à chaque exécution (TOFU), ce n'est
          # donc pas un pinning strict. Voir la doc pour le détail du risque.
          SSH_CMD_ARGS: "-o StrictHostKeyChecking=yes"
          # Force l'alimentation de known_hosts via ssh-keyscan et sert de test
          # de connexion SSH avant le rsync.
          SCRIPT_BEFORE: |
            echo "Connexion SSH établie sur $(hostname)"
          SCRIPT_BEFORE_REQUIRED: "true"
